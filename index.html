<!-- ===== FASE 16: registro robusto (muestra el error real y no te saca de la pantalla) ===== -->
<style>
#etqmsg{min-height:20px;font-size:15px;font-weight:600;line-height:1.35}
#etqmsg.ok{color:#1F7A4C}
</style>
<script>
(()=>{
if(window.__f16)return;window.__f16=1;
const sb=window.sb;if(!sb)return;
const W=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const btnGo=document.getElementById('etqgo');
if(btnGo&&!document.getElementById('etqmsg')){const m=document.createElement('div');m.id='etqmsg';m.setAttribute('role','alert');btnGo.before(m)}
const human=er=>{const m=String((er&&er.message)||er||'');
  if(/rate limit|too many|security purposes/i.test(m))return 'Se alcanzó el límite de correos. Intenta en unos minutos.';
  if(/database error/i.test(m))return 'Error de base de datos al crear tu perfil: '+m;
  if(/invalid login/i.test(m))return 'Ese correo ya existe y la contraseña no coincide. Inicia sesión o usa «Olvidé mi contraseña».';
  if(/not confirmed/i.test(m))return 'Falta confirmar tu correo. Revisa tu bandeja y spam.';
  return m||'No se pudo crear la cuenta.'};
async function signup(withTags){
  const msg=document.getElementById('etqmsg'),b1=document.getElementById('etqgo'),b2=document.getElementById('etqskip');
  const say=(t,ok)=>{msg.textContent=t;msg.className=ok?'ok':'';try{msg.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}};
  const busy=v=>{b1.disabled=v;b2.disabled=v;b1.textContent=v?'Creando tu cuenta…':'Continuar'};
  const card=document.querySelector('#rol .card.on'),role=card?card.dataset.r:'Ambos';
  const em=($('#em').value||'').trim(),pw=$('#crear input[type=password]').value,us=($('#us').value||'').trim().toLowerCase();
  const a=[],i=[];document.querySelectorAll('#etqc .tg.on').forEach(x=>(x.dataset.l==='a'?a:i).push(x.dataset.k));
  busy(true);say('Creando tu cuenta…',true);
  try{
    const ex=await sb.from('profiles').select('id').eq('username',us).maybeSingle();
    if(ex.data){say('Ese usuario ya existe. Vuelve atrás y elige otro.');return busy(false)}
    const r=await sb.auth.signUp({email:em,password:pw,options:{data:{username:us,role},emailRedirectTo:location.origin+location.pathname}});
    let session=r.data&&r.data.session;
    const dup=!!(r.data&&r.data.user&&r.data.user.identities&&!r.data.user.identities.length);
    if(r.error&&!/already|registered/i.test(r.error.message||'')){say(human(r.error));return busy(false)}
    if(!session){
      const s=await sb.auth.signInWithPassword({email:em,password:pw});
      if(s.error){
        const known=dup||!!r.error;
        say(known?'Ese correo ya tiene una cuenta y la contraseña no coincide. Inicia sesión o usa «Olvidé mi contraseña».':'Te enviamos un correo para confirmar tu cuenta. Confírmalo y vuelve a entrar.',!known);
        return busy(false)}
      session=s.data.session}
    const uid=session.user.id;
    const p=await sb.from('profiles').select('id').eq('id',uid).maybeSingle();
    if(!p.data){
      const u=await sb.from('profiles').upsert({id:uid,username:us,display_name:us,role},{onConflict:'id'});
      if(u.error){say('No se pudo crear tu perfil: '+u.error.message);return busy(false)}}
    if(withTags&&(a.length||i.length))W('comish_pending',JSON.stringify({email:em.toLowerCase(),a,i}));
    else{try{localStorage.removeItem('comish_pending')}catch(e){}}
    say('¡Listo! Entrando…',true);
    setTimeout(()=>location.reload(),400);
  }catch(er){say(human(er));busy(false)}}
document.addEventListener('click',e=>{
  const b=e.target.closest('#etqgo,#etqskip');if(!b)return;
  e.stopImmediatePropagation();e.preventDefault();signup(b.id==='etqgo')},true);
})();
</script>
